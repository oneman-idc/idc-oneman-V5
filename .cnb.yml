$:
  push:
    - name: python-tests
      docker:
        image: python:3.12-slim
      stages:
        - name: install-and-test
          script: |
            python -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt pytest pytest-asyncio
            PYTHONPATH=. pytest -q
  api_trigger:
    - name: python-tests
      docker:
        image: python:3.12-slim
      stages:
        - name: install-and-test
          script: |
            python -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt pytest pytest-asyncio
            PYTHONPATH=. pytest -q
